# CounterGhost Production Stack (Phase 2 Scaffolding)
#
# This Docker Compose file sets up the infrastructure needed for
# the production-grade migration from SQLite to Kafka + Postgres.
#
# Usage:
#   docker-compose up -d          # Start Kafka + Postgres
#   docker-compose logs -f kafka  # Watch Kafka logs
#   docker-compose down -v        # Stop and wipe volumes
#
# NOTE: The Go application still uses SQLite. This scaffolding
# is prepared for Phase 2 migration. See README.md § Production Roadmap.

services:
  # ── Kafka (KRaft mode — no ZooKeeper needed) ──────────────────────
  kafka:
    image: apache/kafka:latest
    container_name: counterghost-kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft mode (no ZooKeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: counterghost-cluster-001
      # Topic auto-creation
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Postgres (node state store + audit trail) ─────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: counterghost-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: counterghost
      POSTGRES_USER: counterghost
      POSTGRES_PASSWORD: counterghost_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d  # Auto-apply schema
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U counterghost"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Kafka UI (optional — visual topic inspector) ──────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: counterghost-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: counterghost
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  postgres_data:
